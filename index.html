<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Piece Character Bingo</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

    <h1>🏴‍☠️ ONE PIECE CHARACTER BINGO</h1>

</header>



<main>


    <div class="buttons">

        <button id="randomBoard">
            🎲 Random Board
        </button>


        <button id="drawMission">
            🎰 Draw Mission 
        </button>




    </div>



    <div id="drawResult">
        
        <h2>Mission</h2>
        
        <!-- เพิ่มกล่อง Wanted คลุมไว้ตรงนี้ครับ -->
        <div id="wantedBox">
            <div class="wanted-inner">
                <p id="drawName">
                    Press "Draw Mission"
                </p>
                <!-- ส่วนระบบโหวต Yes/No (ไม่ต้องเข้าสู่ระบบ) -->
                <div id="voteContainer" style="display: none; width: 100%;">
                    <hr>
                    <div class="vote-title">โหวตเห็นด้วยกับภารกิจนี้? (Is this mission fair?)</div>
                    <div class="vote-buttons">
                        <button id="voteYes" class="vote-btn">
                            👍 ใช่ <span id="yesCount" class="vote-count">0</span>
                        </button>
                        <button id="voteNo" class="vote-btn">
                            👎 ไม่ใช่ <span id="noCount" class="vote-count">0</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>







    <div id="customArea"></div>





    <div id="bingoBoard"></div>





    <div id="bingoMessage"></div>




</main>




<script src="js/script.js"></script>


</body>


</html>
